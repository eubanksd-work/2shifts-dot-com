<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;500;600&display=swap">
<div style="position: relative; width: 960px; height: 288px; background: var(--surface); overflow: hidden; font-family: var(--font-sans);">
<!--
derivation
blocks: ink slab surface-inverse 240x288 flush right edge; accent block 128x160 (space-12 x2 by space-16+space-12); signal block 64x64 (space-12); muted-inverse tint slab 96x288 (space-16 - space-1)
arrangement: one tall slab bleeding off the right edge with a green satellite and a small amber square, a paper-tint band between them, staggered on a 32px step
pattern: literal motif, the half circle -- one large half-disc (r 96 = space-16 - space-1) cut from the ink slab in surface, plus two hairlines (rule-strong, 1px) crossing the blocks at y 96 and y 192 (space-16 - space-1 steps); "the mark is a circle with its second half filled" chose it
scales: space-8 stagger, space-12 and space-16 sides, radius-none everywhere, radius-pill for the disc (rx = r)
-->
<svg width="960" height="288" viewBox="0 0 960 288" style="position: absolute; inset: 0;" aria-hidden="true">
  <style>
    .inv{fill:var(--surface-inverse)} .acc{fill:var(--accent)} .sig{fill:var(--signal)} .tint{fill:var(--rule)} .gnd{fill:var(--surface)} .hair{stroke:var(--rule-strong);stroke-width:var(--hairline)}
  </style>
  <rect class="tint" x="560" y="0" width="96" height="288"/>
  <rect class="inv" x="720" y="0" width="240" height="288"/>
  <rect class="acc" x="592" y="64" width="128" height="160"/>
  <rect class="sig" x="656" y="224" width="64" height="64"/>
  <path class="gnd" d="M840 48 A96 96 0 0 1 840 240 Z"/>
  <line class="hair" x1="480" y1="96" x2="960" y2="96"/>
  <line class="hair" x1="480" y1="192" x2="960" y2="192"/>
</svg>
<div style="position: absolute; left: 40px; bottom: 40px; max-width: 440px;">
  <div style="font-family: var(--font-serif); font-size: 88px; line-height: 0.95; letter-spacing: -0.02em; font-weight: 400; color: var(--ink);">Second<br>Shift</div>
  <div style="margin-top: 16px; font-size: 14px; color: var(--muted);">Automation for firms, built after hours.</div>
</div>
</div>
