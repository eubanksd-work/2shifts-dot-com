<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;500;600&display=swap">
<div style="font-family: var(--font-sans); background: var(--surface); color: var(--ink); padding: 8px 24px 0;">
  <div style="display: flex; align-items: baseline; justify-content: space-between; padding-bottom: 16px; border-bottom: 1px solid var(--rule-strong);">
    <div style="font-family: var(--font-serif); font-size: 32px; font-weight: 400; letter-spacing: -0.01em;">Services</div>
    <div style="font-size: 14px; color: var(--muted);">Each one is a bounded project, not a subscription.</div>
  </div>
  <div style="display: grid; grid-template-columns: 180px minmax(0,1fr) 220px; gap: 24px; padding: 24px 0; border-bottom: 1px solid var(--rule);">
    <div style="font-family: var(--font-serif); font-size: 24px; font-weight: 400;">Intake</div>
    <div style="font-size: 16px; line-height: 1.6; color: var(--muted);">A form on your site becomes a contact, a conflict check, an open matter, a client folder, and a booked consultation.</div>
    <div style="font-size: 14px; line-height: 1.5; color: var(--muted);">Typical fit: any firm taking more than a few new matters a week.</div>
  </div>
</div>
